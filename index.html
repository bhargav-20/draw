<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6965db" />
    <meta name="referrer" content="origin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Local-first project & design manager in front of the Excalidraw canvas."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Excalidraw Projects</title>

    <!-- minimise white flash on load when the user has dark mode enabled (same guard as excalidraw.com) -->
    <script>
      try {
        var theme = window.localStorage.getItem("excalidraw-projects-theme");
        if (!theme || theme === "system") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        console.error("Error setting dark mode", e);
      }
    </script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      html.dark {
        background-color: #121212;
        color: #fff;
      }
    </style>
    <script>
      // self-hosted excalidraw fonts (copied from the package into /public/fonts by `scripts/copy-fonts.mjs`)
      window.EXCALIDRAW_ASSET_PATH = "%BASE_URL%";
    </script>
    <!--
      The package registers Excalifont at runtime, but only once the editor
      mounts — the dashboard never does. Declare it here, where `%BASE_URL%`
      keeps the path right under a sub-path deploy, and limit it to Latin so it
      can never be picked for anything but our own hand-drawn labels.
    -->
    <style>
      @font-face {
        font-family: "Excalifont";
        src: url("%BASE_URL%fonts/Excalifont/Excalifont-Regular-latin.woff2")
          format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        unicode-range: U+20-7e;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
